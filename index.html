<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pasta de Magic</title>
  <meta name="description" content="Uma pasta virtual para folhear uma coleção de cartas de Magic.">
  <meta name="theme-color" content="#fbf7ef">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='4' fill='%234c3fb8'/%3E%3Ccircle cx='16' cy='9' r='3' fill='%23f3c969'/%3E%3Ccircle cx='22.6' cy='14' r='3' fill='%236db7ea'/%3E%3Ccircle cx='20' cy='22' r='3' fill='%23a98df0'/%3E%3Ccircle cx='12' cy='22' r='3' fill='%23ef7f75'/%3E%3Ccircle cx='9.4' cy='14' r='3' fill='%236fce96'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/binder.css">
</head>
<body>
  <div class="aura" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

  <main class="stage">
    <div class="book" id="book" data-view="closed" aria-label="Pasta de cartas">
      <div class="backboard">
        <p class="backboard-note" id="endNote"></p>
      </div>
      <div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <p class="status-message" id="statusMessage" hidden></p>
  </main>

  <nav class="controls" aria-label="Navegação da pasta">
    <button class="control" id="prev" type="button" aria-label="Página anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="indicator" id="indicator" aria-live="polite">Capa</span>
    <button class="control" id="next" type="button" aria-label="Próxima página">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="control control-filter" id="filterToggle" type="button" popovertarget="filters" aria-label="Filtrar cartas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg>
      <span class="filter-badge" id="filterBadge" hidden></span>
    </button>
    <button class="control control-sound" id="sound" type="button" aria-pressed="true" aria-label="Som da folha">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 10v4h4l5 4V6L8 10z"/>
        <path class="sound-waves" d="M16.5 9a4 4 0 010 6M19 6.5a8 8 0 010 11"/>
        <path class="sound-off" d="M16.5 9.5l5 5m0-5l-5 5"/>
      </svg>
    </button>
  </nav>

  <footer class="legal">
    Conteúdo de fã não oficial, permitido pela Política de Conteúdo de Fãs. Não é aprovado nem endossado pela Wizards.
    Partes dos materiais usados são propriedade da Wizards of the Coast. ©Wizards of the Coast LLC.
    Dados e imagens: <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>.
  </footer>

  <section class="filters" id="filters" popover aria-label="Filtros da pasta">
    <div id="filterGroups"></div>
    <div class="filter-footer">
      <span class="filter-count" id="filterCount" aria-live="polite"></span>
      <button class="ghost-button" id="filterClear" type="button" hidden>Limpar</button>
      <button class="ghost-button" type="button" popovertarget="filters" popovertargetaction="hide">Ver cartas</button>
    </div>
  </section>

  <dialog class="zoom" id="zoom" aria-labelledby="zoomName">
    <div class="zoom-layout">
      <div class="zoom-stage">
        <div class="zoom-card" id="zoomCard">
          <div class="zoom-face zoom-front"><img id="zoomFront" alt=""><span class="foil-layer"></span></div>
          <div class="zoom-face zoom-back"><img id="zoomBack" alt=""><span class="foil-layer"></span></div>
        </div>
      </div>
      <div class="zoom-info" id="zoomInfo">
        <h2 id="zoomName"></h2>
        <p class="zoom-original" id="zoomOriginal"></p>
        <dl class="zoom-facts" id="zoomFacts"></dl>
        <div class="zoom-actions">
          <a class="price-link" id="priceLink" target="_blank" rel="noopener">Ver preço na Liga Magic</a>
          <button class="ghost-button" id="zoomFlip" type="button">Virar carta</button>
          <button class="ghost-button" id="zoomClose" type="button">Fechar</button>
        </div>
      </div>
    </div>
  </dialog>

  <script src="js/binder.js" type="module"></script>
</body>
</html>
